<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldenEye 007 (web port, dev)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  canvas#canvas { background: #000; width: 640px; height: 480px; max-width: 100%; image-rendering: pixelated; }
  #rompick { padding: 12px; border: 1px solid #444; border-radius: 6px; }
  #status { min-height: 1.2em; }
  #log { width: 640px; max-width: 100%; height: 160px; overflow: auto; font: 11px monospace; color: #8a8; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="rompick">
    Fan-made web port; bring your own ROM. Choose your GoldenEye 007 (Europe) ROM file:
    <input type="file" id="romfile" accept=".z64,.n64,.v64,.rom,.bin">
    <div><small>The ROM stays in this browser (IndexedDB); it is never uploaded.</small></div>
  </div>
  <div id="status"></div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="log"></div>
</div>
<script src="main.js"></script>
</body>
</html>
